<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plata al Día</title>
<meta name="description" content="Anotá tus ingresos y gastos y mirá cómo viene tu mes.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plata al Día">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de teléfono. Cabecera con selector de mes, contenido por pestañas, barra inferior con botón central para cargar. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#17211C; --mute:#66726B; --line:#E0E5DE; --soft:#E9EDE6;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --in:#13805A; --in-soft:#DDF1E8; --out:#CC4631; --out-soft:#FAE5E0; --warn:#B7791F;
  --c0:#1D4ED8; --c1:#0E8F7A; --c2:#D9822B; --c3:#B83280; --c4:#6D5BD0; --c5:#4C9A2A; --c6:#C2410C; --c7:#0891B2; --c8:#8B6F47; --c9:#64748B;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"SF Pro Text",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#171F1B; --ink:#E9EFEA; --mute:#93A09A; --line:#26312B; --soft:#202A25;
    --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2742;
    --in:#4CC796; --in-soft:#17332A; --out:#F07A66; --out-soft:#3A201B; --warn:#E0A94A;
    --c0:#7C9BFF; --c1:#3FC5AE; --c2:#EDA458; --c3:#E577B8; --c4:#A597F0; --c5:#8FD05E; --c6:#F08A57; --c7:#4FC8E0; --c8:#C4A57A; --c9:#94A3B8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#171F1B; --ink:#E9EFEA; --mute:#93A09A; --line:#26312B; --soft:#202A25;
  --accent:#7C9BFF; --accent-ink:#0B1020; --accent-soft:#1D2742;
  --in:#4CC796; --in-soft:#17332A; --out:#F07A66; --out-soft:#3A201B; --warn:#E0A94A;
  --c0:#7C9BFF; --c1:#3FC5AE; --c2:#EDA458; --c3:#E577B8; --c4:#A597F0; --c5:#8FD05E; --c6:#F08A57; --c7:#4FC8E0; --c8:#C4A57A; --c9:#94A3B8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html:root{padding:0}
html,body{height:100%;overflow:hidden}
.ib[disabled]{opacity:.3;cursor:default}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-display);letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-inline:16px;padding-block:0 calc(108px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;padding-block:calc(12px + env(safe-area-inset-top,0px)) 10px}
.month{display:flex;align-items:center;gap:4px}
.month h1{margin:0;font:700 22px/1 var(--f-display);min-width:150px;text-align:center;text-transform:capitalize;text-wrap:balance}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute);background:var(--soft)}
.ib:active{transform:scale(.94)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0 0 10px;font:700 13px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
section{margin-top:22px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid var(--line)}
.hero{padding:20px 18px 18px}
.hero .lbl{color:var(--mute);font-size:13px;font-weight:600}
.hero .big{font-size:42px;line-height:1.1;font-weight:700;margin-top:2px}
.split{display:flex;gap:10px;margin-top:16px}
.split>div{flex:1;border-radius:12px;padding:10px 12px}
.split .in{background:var(--in-soft)} .split .out{background:var(--out-soft)}
.split small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
.split b{font-size:19px;font-weight:700}
.split em{display:block;font-size:11.5px;line-height:1.3;margin-top:3px}
.split .in b{color:var(--in)} .split .out b{color:var(--out)}
.hint{margin:14px 0 0;color:var(--mute);font-size:14px}
.pos{color:var(--in)} .neg{color:var(--out)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bud{display:flex;flex-direction:column;gap:14px}
.bud .row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.bud .row span:last-child{color:var(--mute);text-align:right}
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font:700 15px var(--f-display);color:#fff;background:var(--c9)}
:root[data-theme="dark"] .dot{color:#0B1020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot{color:#0B1020}}
.tx .m{flex:1;min-width:0}
.tx .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m small{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-size:16px;font-weight:700;white-space:nowrap}
.day{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:600;padding:16px 2px 6px}
.empty{padding:28px 12px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:600;color:var(--mute);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;min-height:44px}
.filters{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.seg.slide{position:relative}
.seg.slide::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px - (var(--n) - 1)*3px)/var(--n));border-radius:9px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.seg.slide::before{transform:translateX(calc(var(--pos)*(100% + 3px)))}
.seg.slide button{position:relative;z-index:1;background:none!important;box-shadow:none!important;transition:color .3s ease}
@media (prefers-reduced-motion:reduce){.seg.slide::before{transition:none}}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{color:var(--mute);font-weight:600;font-size:12.5px;display:block}
.kpi b{font-size:20px;display:block;margin-top:2px}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600}
.legend{display:flex;flex-direction:column;margin-top:14px}
.leg{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.leg:first-child{border-top:0}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.leg .n{flex:1;min-width:0}
.leg .p{color:var(--mute);width:42px;text-align:right}
.leg .v{font-weight:700;min-width:84px;text-align:right}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{font:500 10.5px var(--f-body);fill:var(--mute)}
svg .grid{stroke:var(--line);stroke-width:1}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.key span{display:flex;gap:6px;align-items:center}
.key i{width:10px;height:10px;border-radius:3px;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0 4px;font-size:11.5px;font-weight:600;color:var(--mute)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:background-color .35s ease,transform .35s cubic-bezier(.2,.9,.3,1.3)}
.tab:active .ico{transform:scale(.92)}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ico{background:var(--accent-soft)}
.add{justify-self:center;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.add svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.add:active{transform:scale(.95)}
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font:700 20px var(--f-display)}
.sh{display:flex;justify-content:space-between;align-items:center}
.amt{display:flex;align-items:baseline;gap:6px;justify-content:center;padding:6px 0}
.amt span{font:700 30px var(--f-display);color:var(--mute)}
.amt input{font:700 44px var(--f-display);border:0;background:none;width:100%;max-width:260px;text-align:left;padding:0;outline:none;color:var(--ink);min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip i{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
label.l{font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:14px;border-radius:14px;font-weight:700;text-align:center;font-size:16px;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.del{background:var(--out-soft);color:var(--out)}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px}
.set{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.srow .field{max-width:140px;text-align:right}
.demo{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-top:6px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:30;max-width:90%}
textarea.field{min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace}
.rm{color:var(--out);font-weight:600;font-size:13px;padding:6px 8px}
.welcome{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));overflow:auto}
.welcome>*{width:100%;max-width:520px}
.wtop{display:flex;justify-content:space-between;align-items:center;min-height:36px}
.wbrand{font:700 18px var(--f-display)}
.wbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:20px}
.wart{display:flex;justify-content:center;pointer-events:none}
.wtxt small{color:var(--accent);font-weight:700;letter-spacing:.07em;text-transform:uppercase;font-size:12.5px}
.wtxt h2{font:700 32px/1.1 var(--f-display);letter-spacing:-.01em;text-transform:none;color:var(--ink);margin:6px 0 10px;text-wrap:balance}
.wtxt p{margin:0;font-size:16.5px;color:var(--mute);line-height:1.5}
.wfoot{display:flex;flex-direction:column;gap:16px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}
.dots i.on{width:22px;background:var(--accent)}
.wbtns{display:flex;gap:10px}.wbtns .btn{flex:1}
.help{position:fixed;left:max(16px,calc(50% - 264px));bottom:calc(94px + env(safe-area-inset-bottom,0px));z-index:7;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--mute);font:700 16px var(--f-display);box-shadow:0 2px 8px rgba(0,0,0,.12)}
svg rect{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .4s cubic-bezier(.2,.8,.2,1)}
  .scrim{animation:fade .3s ease-out}
  .scrim.still,.scrim.still .sheet{animation:none}
  .toast{animation:toast .35s ease-out}
  .wbody{animation:rise .65s cubic-bezier(.2,.8,.2,1) both}
  .wart>*{animation:pop .8s .15s cubic-bezier(.2,.9,.3,1.2) both}
  .anim section,.anim .day,.anim .filters,.anim .demo{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
  .anim .bar>i{animation:growx 1.3s .35s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
  .anim .stack{animation:wipe 1.15s .3s cubic-bezier(.2,.8,.2,1) both}
  .anim svg rect{animation:growy 1s .3s cubic-bezier(.2,.8,.2,1) both}
  .anim svg path,.anim svg circle{animation:fade 1.1s .4s both}
  .btn,.chip,.add,.ib,.tab,.help,.seg button,.tx{transition:transform .2s ease,background-color .3s ease,color .3s ease,border-color .3s ease}
  .btn:active,.chip:active,.help:active,.seg button:active{transform:scale(.96)}
  .tx:active{background:var(--soft)}
  .add{animation:pop .85s .4s cubic-bezier(.2,.9,.3,1.3) both}
  .bar>i{transition:width .7s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.5}}
  @keyframes fade{from{opacity:0}}
  @keyframes toast{from{opacity:0;transform:translate(-50%,10px)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}}
  @keyframes pop{from{opacity:0;transform:scale(.88)}}
  @keyframes growx{from{transform:scaleX(0)}}
  @keyframes growy{from{transform:scaleY(0)}}
  @keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="chrome"></div>
<div id="layer"></div>
<script>
(function(){
"use strict";
var KEY="plata-al-dia-v1";
var MES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
var mem=null;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem}
function persist(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function defaults(){
  return{tx:[],demo:false,budgets:{},cats:{
    expense:[["Comida",0],["Supermercado",1],["Transporte",2],["Vivienda",3],["Servicios",4],["Salud",5],["Ocio",6],["Compras",7],["Educación",8],["Otros",9]].map(function(a,i){return{id:"e"+i,name:a[0],c:a[1]}}),
    income:[["Sueldo",1],["Freelance",0],["Inversiones",4],["Otros ingresos",9]].map(function(a,i){return{id:"i"+i,name:a[0],c:a[1]}})
  }};
}
var now=new Date();
var S=load();
if(!S||!S.cats){S=defaults();persist()}
else if(S.demo&&!S.welcomed){S=defaults();persist()}
else if(!S.welcomed&&S.tx.length){S.welcomed=true;persist()}
var V={view:"home",ym:now.getFullYear()+"-"+pad(now.getMonth()+1),q:"",ft:"all"};

/* ---------- datos de ejemplo ---------- */
function sample(){
  var d=defaults(),t=[],y=now.getFullYear(),m=now.getMonth();
  function add(mo,day,type,cat,amt,note){var dt=new Date(y,m-mo,day);if(mo===0&&dt>now)return;t.push({id:uid(),type:type,cat:cat,amount:amt,date:ymd(dt),note:note||""})}
  var base=[
    ["i0",1,"in",1800000,"Sueldo"],["i1",12,"in",350000,"Trabajo freelance"],
    ["e3",3,"out",520000,"Alquiler"],["e4",5,"out",86000,"Luz, gas e internet"],
    ["e1",4,"out",142000,"Supermercado semanal"],["e1",11,"out",128000,"Supermercado"],["e1",18,"out",151000,"Supermercado"],
    ["e0",8,"out",46000,"Cena con amigos"],["e0",15,"out",32000,"Delivery"],["e2",6,"out",64000,"Carga SUBE y nafta"],
    ["e5",14,"out",78000,"Farmacia"],["e6",9,"out",39000,"Cine y salida"],["e7",16,"out",112000,"Ropa"],["e8",10,"out",54000,"Curso de inglés"]
  ];
  for(var mo=0;mo<6;mo++){base.forEach(function(b,i){
    var f=1+(((i*7+mo*13)%11)-5)/40;
    if(mo>0||true)add(mo,b[1],b[2],b[0],Math.round(b[3]*f*(1-mo*.025)/100)*100,b[4]);
  })}
  d.tx=t;d.demo=true;d.welcomed=true;d.budgets={e0:90000,e1:450000,e2:90000,e6:60000,e7:100000};
  return d;
}

/* ---------- utilidades ---------- */
function money(n,sign){var a=Math.abs(Math.round(n));var s="$ "+a.toLocaleString("es-AR");return(n<0?"−":(sign?"+":""))+s}
function compact(n){if(n>=1e6)return(n/1e6).toFixed(1).replace(".0","").replace(".",",")+" M";if(n>=1e3)return Math.round(n/1e3)+" k";return""+Math.round(n)}
function ymParts(k){var p=k.split("-");return{y:+p[0],m:+p[1]-1}}
function shift(k,d){var p=ymParts(k),dt=new Date(p.y,p.m+d,1);return dt.getFullYear()+"-"+pad(dt.getMonth()+1)}
function label(k,short){var p=ymParts(k);return short?MES[p.m].slice(0,3):MES[p.m]+" "+p.y}
function firstYm(){var c=ymd(now).slice(0,7);S.tx.forEach(function(t){var k=t.date.slice(0,7);if(k<c)c=k});return c}
function inMonth(k){return S.tx.filter(function(t){return t.date.slice(0,7)===k})}
function sums(list){var i=0,o=0;list.forEach(function(t){if(t.type==="in")i+=t.amount;else o+=t.amount});return{i:i,o:o,b:i-o}}
function findCat(id){var all=S.cats.expense.concat(S.cats.income);for(var j=0;j<all.length;j++)if(all[j].id===id)return all[j];return{id:id,name:"Sin categoría",c:9}}
function byCat(list,type){var m={};list.filter(function(t){return t.type===type}).forEach(function(t){m[t.cat]=(m[t.cat]||0)+t.amount});
  return Object.keys(m).map(function(k){return{id:k,v:m[k]}}).sort(function(a,b){return b.v-a.v})}
function dayLabel(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);var t=ymd(now),y=ymd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-1));
  if(s===t)return"Hoy";if(s===y)return"Ayer";return DIAS[d.getDay()]+" "+d.getDate()}
function delta(cur,prev,upBad){
  if(!prev)return'<em style="color:var(--mute)">sin dato previo</em>';
  var p=Math.round((cur-prev)/Math.abs(prev)*100);if(p===0)return'<em style="color:var(--mute)">igual que el mes pasado</em>';
  var bad=upBad?p>0:p<0;
  var arrow='<svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true" style="margin-right:4px"><path fill="currentColor" d="'+(p>0?"M5 1L9.5 9H.5z":"M5 9L.5 1h9z")+'"/></svg>';
  return'<em class="'+(bad?"neg":"pos")+'">'+arrow+(p>0?"subió ":"bajó ")+Math.abs(p)+"% vs mes pasado</em>";
}
function ic(n){var P={
 left:'<path d="M15 5l-7 7 7 7"/>',right:'<path d="M9 5l7 7-7 7"/>',
 home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>'};
 return'<svg viewBox="0 0 24 24" aria-hidden="true">'+P[n]+"</svg>"}

/* ---------- vistas ---------- */
function head(){
  return'<header class="top"><div class="month"><button class="ib" data-a="prev" aria-label="Mes anterior"'+(V.ym<=firstYm()?" disabled":"")+'>'+ic("left")+'</button><h1>'+label(V.ym)+'</h1><button class="ib" data-a="next" aria-label="Mes siguiente"'+(V.ym>=ymd(now).slice(0,7)?" disabled":"")+'>'+ic("right")+"</button></div>"+
  (V.ym!==ymd(now).slice(0,7)?'<button class="link" data-a="today">Ir a hoy</button>':"")+"</header>";
}
function txRow(t){
  var c=findCat(t.cat);
  return'<button class="tx" data-a="edit" data-id="'+t.id+'"><span class="dot" style="background:var(--c'+c.c+')">'+esc(c.name.charAt(0))+'</span><span class="m"><b>'+esc(t.note||c.name)+"</b><small>"+esc(c.name)+" · "+dayLabel(t.date).toLowerCase()+'</small></span><span class="a num '+(t.type==="in"?"pos":"")+'">'+money(t.type==="in"?t.amount:-t.amount,t.type==="in")+"</span></button>";
}
function emptyBox(){return'<div class="empty"><b>Todavía no hay movimientos</b>Tocá el botón + para cargar tu primer ingreso o gasto.</div>'}

function home(){
  var L=inMonth(V.ym),s=sums(L),prev=sums(inMonth(shift(V.ym,-1)));
  var rate=s.i>0?Math.round(s.b/s.i*100):null;
  var h=head();
  if(S.demo)h+='<div class="demo"><span>Estás viendo <b>datos de ejemplo</b>.</span><button class="link" data-a="cleardemo">Borrar y empezar</button></div>';
  h+='<section style="margin-top:12px"><div class="card hero"><div class="lbl">Balance del mes</div><div class="big num '+(s.b<0?"neg":"")+'" data-n="'+s.b+'">'+money(s.b)+'</div>'+
   '<div class="split"><div class="in"><small>Ingresos</small><b class="num" data-n="'+s.i+'">'+money(s.i)+'</b>'+(prev.i?delta(s.i,prev.i,false):"")+'</div><div class="out"><small>Egresos</small><b class="num" data-n="'+s.o+'">'+money(s.o)+"</b>"+(prev.o?delta(s.o,prev.o,true):"")+"</div></div>"+
   '<p class="hint">'+(rate===null?(s.o?"Cargá tus ingresos para ver cuánto ahorrás.":"Sin movimientos este mes."):(rate>=0?"Ahorraste el <b>"+rate+"%</b> de lo que ingresó.":"Gastaste <b>"+money(-s.b)+"</b> más de lo que ingresó."))+" "+(prev.b?"<br>Tu ahorro: "+delta(s.b,prev.b,false):"")+"</p></div></section>";
  var bl=S.cats.expense.filter(function(c){return S.budgets[c.id]>0});
  h+="<section><h2>Presupuestos</h2>";
  if(bl.length){
    var sp={};byCat(L,"out").forEach(function(x){sp[x.id]=x.v});
    h+='<div class="card bud">'+bl.map(function(c){var b=S.budgets[c.id],v=sp[c.id]||0,p=v/b,col=p>1?"var(--out)":p>.8?"var(--warn)":"var(--in)";
      return'<div><div class="row"><span><b>'+esc(c.name)+'</b></span><span class="num">'+money(v)+" de "+money(b)+'</span></div><div class="bar" role="img" aria-label="'+Math.round(p*100)+'% usado"><i style="width:'+Math.min(100,p*100)+"%;background:"+col+'"></i></div>'+
      (p>1?'<small class="neg" style="font-weight:600">Te pasaste por '+money(v-b)+"</small>":'<small style="color:var(--mute)">Te quedan '+money(b-v)+"</small>")+"</div>"}).join("")+"</div>";
  }else h+='<div class="card empty"><b>Poné un tope a tus gastos</b>Definí cuánto querés gastar por categoría y seguí el avance acá. <br><button class="link" data-a="tab" data-v="settings">Configurar presupuestos</button></div>';
  h+="</section><section><h2>Últimos movimientos</h2><div class=\"card\" style=\"padding:4px 16px\">";
  var rec=L.slice().sort(function(a,b){return b.date.localeCompare(a.date)||0}).slice(0,5);
  h+=rec.length?'<div class="list">'+rec.map(txRow).join("")+"</div>":emptyBox();
  h+="</div>"+(L.length>5?'<p style="text-align:center;margin:12px 0 0"><button class="link" data-a="tab" data-v="list">Ver los '+L.length+" movimientos</button></p>":"")+"</section>";
  return h;
}

var FTS=["all","in","out"];
function listView(){
  var L=inMonth(V.ym).filter(function(t){return V.ft==="all"||t.type===V.ft});
  var q=V.q.trim().toLowerCase();
  if(q)L=L.filter(function(t){return(t.note+" "+findCat(t.cat).name).toLowerCase().indexOf(q)>-1});
  L.sort(function(a,b){return b.date.localeCompare(a.date)});
  var h=head()+'<div class="filters"><input id="q" class="field" type="search" placeholder="Buscar por nota o categoría" value="'+esc(V.q)+'" aria-label="Buscar"><div class="seg slide" id="ft_seg" style="--n:3;--pos:'+FTS.indexOf(V.ftFrom||V.ft)+'">'+
   [["all","Todos"],["in","Ingresos"],["out","Egresos"]].map(function(x){return'<button data-a="ft" data-v="'+x[0]+'" aria-pressed="'+(V.ft===x[0])+'">'+x[1]+"</button>"}).join("")+"</div></div>";
  if(!L.length)return h+'<div class="card empty" style="margin-top:16px">'+(q||V.ft!=="all"?"<b>Sin resultados</b>Probá con otro filtro.":emptyBox().replace('<div class="empty">',"<div>"))+"</div>";
  var g={},ord=[];L.forEach(function(t){if(!g[t.date]){g[t.date]=[];ord.push(t.date)}g[t.date].push(t)});
  ord.forEach(function(d){var s=sums(g[d]);h+='<div class="day"><span style="text-transform:capitalize">'+dayLabel(d)+'</span><span class="num">'+money(s.b,true)+'</span></div><div class="card" style="padding:4px 16px"><div class="list">'+g[d].map(txRow).join("")+"</div></div>"});
  return h;
}

/* ---------- gráficos ---------- */
function niceMax(m){if(m<=0)return 4;var p=Math.pow(10,Math.floor(Math.log10(m))),F=[1,1.2,1.6,2,2.4,3,4,5,6,8,10];for(var i=0;i<F.length;i++)if(m<=F[i]*p)return F[i]*p;return 10*p}
function barChart(){
  var ks=[],i,f0=firstYm();for(i=5;i>=0;i--){var kk=shift(V.ym,-i);if(kk>=f0)ks.push(kk)}
  var data=ks.map(function(k){return sums(inMonth(k))});
  var max=niceMax(Math.max.apply(null,data.map(function(d){return Math.max(d.i,d.o)}))),W=340,H=190,l=44,r=6,t=10,b=24,cw=W-l-r,ch=H-t-b,g=cw/ks.length,bw=Math.min(16,g/2-3);
  var s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Ingresos y egresos de los últimos 6 meses">';
  for(i=0;i<=4;i++){var y=t+ch-ch*i/4;s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(l-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+compact(max*i/4)+"</text>"}
  data.forEach(function(d,j){var cx=l+g*j+g/2,hi=ch*d.i/max,ho=ch*d.o/max,cur=ks[j]===V.ym;
    s+='<rect x="'+(cx-bw-1)+'" y="'+(t+ch-hi)+'" width="'+bw+'" height="'+hi+'" rx="3" fill="var(--in)"/><rect x="'+(cx+1)+'" y="'+(t+ch-ho)+'" width="'+bw+'" height="'+ho+'" rx="3" fill="var(--out)"/>'+
    '<text x="'+cx+'" y="'+(H-7)+'" text-anchor="middle" style="'+(cur?"fill:var(--ink);font-weight:700":"")+'">'+label(ks[j],true)+"</text>"});
  return'<div class="key"><span><i style="background:var(--in)"></i>Ingresos</span><span><i style="background:var(--out)"></i>Egresos</span></div>'+s+"</svg>";
}
function cumul(k){var p=ymParts(k),n=new Date(p.y,p.m+1,0).getDate(),a=[],i;for(i=0;i<=n;i++)a.push(0);
  inMonth(k).forEach(function(t){if(t.type==="out")a[+t.date.slice(8,10)]+=t.amount});for(i=1;i<=n;i++)a[i]+=a[i-1];return a}
function lineChart(){
  var A=cumul(V.ym),B=cumul(shift(V.ym,-1)),n=A.length-1,cur=V.ym===ymd(now).slice(0,7),last=cur?now.getDate():n;
  var max=niceMax(Math.max(A[last],B[B.length-1],1)),W=340,H=170,l=44,r=14,t=10,b=24,cw=W-l-r,ch=H-t-b,i;
  function X(d){return l+cw*(d-1)/(Math.max(n,2)-1)}function Y(v){return t+ch-ch*v/max}
  var s='<svg class="chart" viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Gasto acumulado día a día">';
  for(i=0;i<=4;i++){var y=t+ch-ch*i/4;s+='<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(l-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+compact(max*i/4)+"</text>"}
  [1,10,20,n].forEach(function(d,j,arr){if(arr.indexOf(d)!==j)return;s+='<text x="'+X(d)+'" y="'+(H-7)+'" text-anchor="middle">'+d+"</text>"});
  var pb="";for(i=1;i<B.length;i++)pb+=(i>1?"L":"M")+X(Math.min(i,n)).toFixed(1)+" "+Y(B[i]).toFixed(1);
  s+='<path d="'+pb+'" fill="none" stroke="var(--mute)" stroke-width="1.8" stroke-dasharray="4 4"/>';
  var pa="";for(i=1;i<=last;i++)pa+=(i>1?"L":"M")+X(i).toFixed(1)+" "+Y(A[i]).toFixed(1);
  s+='<path d="'+pa+"L"+X(last)+" "+(t+ch)+"L"+X(1)+" "+(t+ch)+'Z" fill="var(--out)" opacity=".12"/><path d="'+pa+'" fill="none" stroke="var(--out)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  var ex=X(last),anchor=ex>W-60?"end":"middle";
  s+='<circle cx="'+ex+'" cy="'+Y(A[last])+'" r="4.5" fill="var(--out)" stroke="var(--surface)" stroke-width="2"/><text x="'+(anchor==="end"?ex+6:ex)+'" y="'+(Y(A[last])-9)+'" text-anchor="'+anchor+'" style="fill:var(--ink);font-weight:700">'+compact(A[last])+"</text>";
  return'<div class="key"><span><i style="background:var(--out)"></i>'+label(V.ym)+'</span><span><i style="background:var(--mute)"></i>'+label(shift(V.ym,-1))+"</span></div>"+s+"</svg>";
}
function catBlock(type){
  var L=inMonth(V.ym),P=inMonth(shift(V.ym,-1)),rows=byCat(L,type),tot=rows.reduce(function(a,x){return a+x.v},0),pm={};
  byCat(P,type).forEach(function(x){pm[x.id]=x.v});
  if(!rows.length)return'<div class="empty">Sin '+(type==="out"?"egresos":"ingresos")+" este mes.</div>";
  return'<div class="stack" role="img" aria-label="Distribución por categoría">'+rows.map(function(x){return'<i style="flex:'+x.v+";background:var(--c"+findCat(x.id).c+'"></i>'}).join("")+'</div><div class="legend">'+
   rows.map(function(x){var c=findCat(x.id),pv=pm[x.id];
     return'<div class="leg"><span class="sw" style="background:var(--c'+c.c+')"></span><span class="n">'+esc(c.name)+(pv?'<br><small style="color:var(--mute)">mes pasado '+money(pv)+"</small>":"")+'</span><span class="p num">'+Math.round(x.v/tot*100)+'%</span><span class="v num">'+money(x.v)+"</span></div>"}).join("")+"</div>";
}
function reports(){
  var L=inMonth(V.ym),s=sums(L),p=sums(inMonth(shift(V.ym,-1))),n=new Date(ymParts(V.ym).y,ymParts(V.ym).m+1,0).getDate();
  var cur=V.ym===ymd(now).slice(0,7),elapsed=cur?now.getDate():n,outs=L.filter(function(t){return t.type==="out"}).sort(function(a,b){return b.amount-a.amount});
  var h=head()+'<section style="margin-top:8px"><div class="kpis">'+
   '<div class="kpi"><small>Ingresos</small><b class="num pos">'+money(s.i)+"</b>"+delta(s.i,p.i,false)+"</div>"+
   '<div class="kpi"><small>Egresos</small><b class="num neg">'+money(s.o)+"</b>"+delta(s.o,p.o,true)+"</div>"+
   '<div class="kpi"><small>Ahorro</small><b class="num '+(s.b<0?"neg":"")+'">'+money(s.b)+"</b><em style=\"color:var(--mute)\">"+(s.i?Math.round(s.b/s.i*100)+"% de lo ingresado":"—")+"</em><br>"+delta(s.b,p.b,false)+"</div>"+
   '<div class="kpi"><small>Gasto diario promedio</small><b class="num">'+money(s.o/elapsed)+"</b><em style=\"color:var(--mute)\">"+(cur&&s.o?"Proyección del mes: "+money(s.o/elapsed*n):L.length+" movimientos")+"</em></div></div></section>"+
   '<section><h2>Últimos 6 meses</h2><div class="card">'+barChart()+"</div></section>"+
   '<section><h2>Gasto acumulado</h2><div class="card">'+lineChart()+"</div></section>"+
   '<section><h2>En qué gastaste</h2><div class="card">'+catBlock("out")+"</div></section>"+
   '<section><h2>De dónde vino la plata</h2><div class="card">'+catBlock("in")+"</div></section>";
  if(outs.length)h+='<section><h2>Mayores gastos</h2><div class="card" style="padding:4px 16px"><div class="list">'+outs.slice(0,3).map(txRow).join("")+"</div></div></section>";
  h+='<section><button class="btn sec" style="width:100%" data-a="csv">Exportar este mes (CSV)</button></section>';
  return h;
}

  return h;

var TABS=[["home","Inicio","home"],["list","Movimientos","list"],null,["reports","Reportes","chart"],["settings","Ajustes","gear"]];
function drawNav(){
  document.getElementById("chrome").innerHTML='<nav class="tabs" aria-label="Secciones"><div>'+TABS.map(function(t){
    return t?'<button class="tab" data-a="tab" data-v="'+t[0]+'"><span class="ico">'+ic(t[2])+"</span>"+t[1]+"</button>":'<button class="add" data-a="new" aria-label="Agregar movimiento">'+ic("plus")+"</button>"}).join("")+'</div></nav><button class="help" data-a="help" aria-label="Ver la bienvenida otra vez">?</button>';

function render(keepScroll){
  if(keepScroll)document.getElementById("app").classList.remove("anim");
  if(V.ym<firstYm())V.ym=firstYm();
  var y=document.getElementById("app").scrollTop,v=V.view,html=v==="home"?home():v==="list"?listView():v==="reports"?reports():settings();
  document.getElementById("app").innerHTML=html;
  document.querySelectorAll("#chrome .tab").forEach(function(b){if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(keepScroll)document.getElementById("app").scrollTop=y;else animate();
}
function animate(){
  var app=document.getElementById("app");
  app.classList.remove("anim");void app.offsetWidth;app.classList.add("anim");
  app.querySelectorAll("section,.day,.filters,.demo").forEach(function(el,i){el.style.setProperty("--i",Math.min(i,9))});
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  app.querySelectorAll("[data-n]").forEach(function(el){
    var to=+el.dataset.n,t0=null;
    function step(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/950),e=1-Math.pow(1-p,3);el.textContent=money(to*e);if(p<1)requestAnimationFrame(step);else el.textContent=money(to)}
    requestAnimationFrame(step);
  });
}

   art:'<div class="card bud" style="width:100%"><div><div class="row"><span><b>Comida</b></span><span class="num">$ 72.000 de $ 90.000</span></div><div class="bar"><i style="width:80%;background:var(--warn)"></i></div></div><div><div class="row"><span><b>Ocio</b></span><span class="num">$ 21.000 de $ 60.000</span></div><div class="bar"><i style="width:35%;background:var(--in)"></i></div></div></div>'},
  {k:"Paso 3",t:"Revisá tus reportes cada mes",p:"En Reportes comparás con el mes anterior, ves en qué gastás más y cómo viene el ritmo del mes. Tus datos quedan en este teléfono: hacé una copia de seguridad de vez en cuando desde Ajustes.",
   art:'<div class="card" style="width:100%"><div class="stack"><i style="flex:5;background:var(--c1)"></i><i style="flex:3;background:var(--c3)"></i><i style="flex:2;background:var(--c2)"></i></div><div class="legend"><div class="leg"><span class="sw" style="background:var(--c1)"></span><span class="n">Supermercado</span><span class="p num">50%</span></div><div class="leg"><span class="sw" style="background:var(--c3)"></span><span class="n">Vivienda</span><span class="p num">30%</span></div></div></div>'}
];
function drawWelcome(){
  var s=STEPS[W],last=W===STEPS.length-1;
  document.getElementById("layer").innerHTML='<div class="welcome" role="dialog" aria-modal="true" aria-label="Bienvenida"><div class="wtop"><span class="wbrand">Plata al Día</span>'+(last?"":'<button class="link" data-a="wdone">Saltar</button>')+'</div><div class="wbody"><div class="wart">'+s.art+'</div><div class="wtxt"><small>'+s.k+"</small><h2>"+s.t+"</h2><p>"+s.p+'</p></div></div><div class="wfoot"><div class="dots" aria-hidden="true">'+STEPS.map(function(_,i){return'<i'+(i===W?' class="on"':"")+"></i>"}).join("")+'</div><div class="wbtns">'+(W>0?'<button class="btn sec" data-a="wback">Atrás</button>':"")+'<button class="btn" data-a="'+(last?"wdone":"wnext")+'">'+(last?"Empezar":"Siguiente")+"</button></div></div></div>";
}

/* ---------- hoja para cargar / editar ---------- */
var F=null;
function openSheet(id){
  var t=id?S.tx.filter(function(x){return x.id===id})[0]:null;
  var dflt=V.ym===ymd(now).slice(0,7)?ymd(now):V.ym+"-01";
  F=t?{id:t.id,type:t.type,amount:String(t.amount).replace(".",","),cat:t.cat,date:t.date,note:t.note,confirm:false}:{id:null,type:"out",amount:"",cat:S.cats.expense[0].id,date:dflt,note:"",confirm:false};
  drawSheet(true);
}
function drawSheet(focus){
  var cats=S.cats[F.type==="in"?"income":"expense"];
  if(!cats.some(function(c){return c.id===F.cat}))F.cat=cats[0]?cats[0].id:"";
  document.getElementById("layer").innerHTML='<div class="scrim' + (F.drawn?" still":"") + '" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Movimiento"><div class="sh"><h3>'+(F.id?"Editar movimiento":"Nuevo movimiento")+'</h3><button class="ib" data-a="close" aria-label="Cerrar">'+ic("x")+"</button></div>"+
   '<div class="seg slide" id="f_seg" style="--n:2;--pos:'+(F.type==="in"?1:0)+'"><button data-a="ftype" data-v="out" aria-pressed="'+(F.type==="out")+'">Egreso</button><button data-a="ftype" data-v="in" aria-pressed="'+(F.type==="in")+'">Ingreso</button></div>'+
   '<div class="amt"><span>$</span><input id="f_amt" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Monto" value="'+esc(F.amount)+'"></div>'+
   '<div><label class="l">Categoría</label><div class="chips" id="f_chips" data-type="'+F.type+'">'+cats.map(function(c){return'<button class="chip" data-a="fcat" data-id="'+c.id+'" aria-pressed="'+(F.cat===c.id)+'"><i style="background:var(--c'+c.c+')"></i>'+esc(c.name)+"</button>"}).join("")+"</div></div>"+
   '<div class="two"><div><label class="l" for="f_date">Fecha</label><input id="f_date" class="field" type="date" max="'+ymd(now)+'" value="'+F.date+'"></div><div><label class="l" for="f_note">Nota</label><input id="f_note" class="field" maxlength="60" placeholder="Opcional" value="'+esc(F.note)+'"></div></div>'+
   '<button class="btn" data-a="save">Guardar</button>'+(F.id?'<button class="btn del" data-a="delete">'+(F.confirm?"Tocá de nuevo para eliminar":"Eliminar")+"</button>":"")+"</div></div>";
  F.drawn=true;
  if(focus&&!F.id)setTimeout(function(){var e=document.getElementById("f_amt");if(e)e.focus()},60);
}
function chipsHtml(){
  return S.cats[F.type==="in"?"income":"expense"].map(function(c){return'<button class="chip" data-a="fcat" data-id="'+c.id+'" aria-pressed="'+(F.cat===c.id)+'"><i style="background:var(--c'+c.c+')"></i>'+esc(c.name)+"</button>"}).join("");
}
function updateSheet(){
  var cats=S.cats[F.type==="in"?"income":"expense"];
  if(!cats.some(function(c){return c.id===F.cat}))F.cat=cats[0]?cats[0].id:"";
  document.getElementById("f_seg").style.setProperty("--pos",F.type==="in"?1:0);
  document.querySelectorAll(".sheet .seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.v===F.type))});
  var box=document.getElementById("f_chips");
  if(box.dataset.type!==F.type){box.innerHTML=chipsHtml();box.dataset.type=F.type}
  else box.querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.id===F.cat))});
}
function readForm(){var a=document.getElementById("f_amt");if(!a)return;F.amount=a.value;F.date=document.getElementById("f_date").value;F.note=document.getElementById("f_note").value}
function closeSheet(){document.getElementById("layer").innerHTML="";F=null}
function toast(m){var e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function parseAmt(s){var n=parseFloat(String(s).replace(/\./g,"").replace(",","."));return isFinite(n)?n:NaN}

/* ---------- exportar ---------- */
function saveFile(name,data){
  try{
    var type=/\.csv$/.test(name)?"text/csv;charset=utf-8":"application/json";
    var url=URL.createObjectURL(new Blob([data],{type:type})),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);toast("Archivo guardado");
  }catch(e){toast("No se pudo guardar")}
}
function csv(){
  var rows=[["Fecha","Tipo","Categoría","Nota","Monto"]];
  inMonth(V.ym).sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(t){rows.push([t.date,t.type==="in"?"Ingreso":"Egreso",findCat(t.cat).name,t.note,String(t.amount).replace(".",",")])});
  return"﻿"+rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(";")}).join("\n");
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-a]");if(!el)return;
  var a=el.dataset.a,v=el.dataset.v,id=el.dataset.id;
  if(a==="scrim"){if(e.target===el)closeSheet();return}
  switch(a){
    case"prev":V.ym=shift(V.ym,-1);render();break;
    case"next":V.ym=shift(V.ym,1);render();break;
    case"today":V.ym=ymd(now).slice(0,7);render();break;
    case"tab":V.view=v;render();document.getElementById("app").scrollTop=0;break;
    case"ft":V.ftFrom=V.ft;V.ft=v;render(true);{var sg=document.getElementById("ft_seg");if(sg){sg.offsetWidth;sg.style.setProperty("--pos",FTS.indexOf(v))}}V.ftFrom=null;break;
    case"new":openSheet();break;
    case"edit":openSheet(id);break;
    case"close":closeSheet();break;
    case"ftype":readForm();F.type=v;updateSheet();break;
    case"fcat":F.cat=id;updateSheet();break;
    case"save":{
      readForm();var n=parseAmt(F.amount);
      if(!(n>0)){toast("Ingresá un monto mayor a cero");document.getElementById("f_amt").focus();break}
      if(!F.date){toast("Elegí una fecha");break}
      var rec={id:F.id||uid(),type:F.type,amount:Math.round(n*100)/100,cat:F.cat,date:F.date,note:F.note.trim()};
      if(F.id)S.tx=S.tx.map(function(t){return t.id===F.id?rec:t});else S.tx.push(rec);
      V.ym=rec.date.slice(0,7);persist();closeSheet();render(true);toast(F.id?"Cambios guardados":"Movimiento guardado");break}
    case"delete":
      if(!F.confirm){readForm();F.confirm=true;drawSheet();break}
      S.tx=S.tx.filter(function(t){return t.id!==F.id});persist();closeSheet();render(true);toast("Movimiento eliminado");break;
    case"addcat":{
      var inp=document.getElementById("nc_"+el.dataset.t),nm=inp.value.trim();if(!nm)break;
      var arr=S.cats[el.dataset.t];arr.push({id:(el.dataset.t==="income"?"i":"e")+uid(),name:nm,c:arr.length%10});persist();render(true);break}
    case"rmcat":{
      var used=S.tx.some(function(t){return t.cat===id});
      if(used&&!confirmTap(el))break;
      S.cats[el.dataset.t]=S.cats[el.dataset.t].filter(function(c){return c.id!==id});delete S.budgets[id];persist();render(true);break}
    case"csv":saveFile("movimientos-"+V.ym+".csv",csv());break;
    case"backup":saveFile("plata-al-dia-copia-"+ymd(now)+".json",JSON.stringify(S));break;
    case"copy":
      try{navigator.clipboard.writeText(JSON.stringify(S)).then(function(){toast("Copia lista para pegar donde quieras")},function(){toast("No se pudo copiar")})}catch(x){toast("No se pudo copiar")}break;
    case"import":{
      try{var d=JSON.parse(document.getElementById("imp").value);if(!d||!Array.isArray(d.tx)||!d.cats)throw 0;S=d;S.welcomed=true;persist();render(true);toast("Copia restaurada")}catch(x){toast("El contenido no es una copia válida")}break}
    case"demo":S=sample();persist();V.view="home";V.ym=ymd(now).slice(0,7);render();toast("Datos de ejemplo cargados");break;
    case"help":W=0;drawWelcome();break;
    case"wnext":W++;drawWelcome();break;
    case"wback":W--;drawWelcome();break;
    case"wdone":S.welcomed=true;persist();document.getElementById("layer").innerHTML="";document.getElementById("app").scrollTop=0;break;
    case"cleardemo":S=defaults();S.welcomed=true;persist();render();toast("Listo, empezá de cero");break;
    case"wipe":
      if(!confirmTap(el))break;
      S=defaults();S.welcomed=true;persist();render(true);toast("Datos borrados");break;
  }
});
function confirmTap(el){
  if(el.dataset.armed){return true}
  el.dataset.armed="1";var old=el.textContent;el.textContent="Tocá de nuevo para confirmar";
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=old}},3000);return false;
}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){V.q=t.value;var pos=t.selectionStart;render(true);var q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos)}
  else if(t.dataset&&t.dataset.b){var n=parseAmt(t.value);if(n>0)S.budgets[t.dataset.b]=n;else delete S.budgets[t.dataset.b];persist()}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&F)closeSheet()});
drawNav();render();
if(!S.welcomed)drawWelcome();
if("serviceWorker" in navigator&&location.protocol!=="file:")window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>

</body></html>
